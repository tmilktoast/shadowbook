<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Shadowbook</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div id="app">
      <nav id="sidebar">
        <h1>Shadowbook</h1>
        <p class="subtitle">Anarchy 2.0 Assistant</p>
        <ul>
          <li><a href="#die-roller">Die Roller</a></li>
          <li><a href="#name-generator">Name Generator</a></li>
          <li><a href="#character-database">Character Database</a></li>
          <li><a href="#npc-generator">NPC Generator</a></li>
          <li><a href="#character-builder">Character Builder</a></li>
          <li><a href="#amp-catalog">Amp Catalog</a></li>
          <li><a href="#amp-creator">Amp Creator</a></li>
          <li><a href="#job-generator">Job Generator</a></li>
        </ul>
      </nav>

      <main id="content">
        <section id="die-roller">
          <h2 class="section-heading">Die Roller</h2>

          <div class="tool-controls">
            <label for="dice-count">Number of dice:</label>
            <input type="number" id="dice-count" min="1" value="1" />

            <label for="dice-sides">Sides:</label>
            <select id="dice-sides">
              <option value="4">d4</option>
              <option value="6" selected>d6</option>
              <option value="8">d8</option>
              <option value="10">d10</option>
              <option value="12">d12</option>
              <option value="20">d20</option>
              <option value="100">d100</option>
            </select>

            <button id="roll-button" type="button" class="btn-primary">
              Roll
            </button>
          </div>

          <div id="roll-results"></div>

          <div class="die-roller-history">
            <div class="history-header">
              <h3 class="section-heading">History</h3>
              <button id="dice-history-clear" type="button" class="btn-secondary">
                Clear
              </button>
            </div>
            <ul
              id="dice-history-list"
              class="history-list"
              data-empty="No rolls yet."
            ></ul>
          </div>
        </section>

        <section id="name-generator" hidden>
          <h2 class="section-heading">Name Generator</h2>

          <div class="tool-controls">
            <label for="name-type">Type:</label>
            <select id="name-type">
              <option value="streetname">Streetname</option>
              <option value="conventional">Conventional</option>
            </select>

            <span id="conventional-options">
              <label for="name-culture">Culture:</label>
              <select id="name-culture"></select>

              <label for="name-gender">Gender:</label>
              <select id="name-gender">
                <option value="">Any</option>
                <option value="male">Male</option>
                <option value="female">Female</option>
              </select>
            </span>

            <label for="name-count">Count:</label>
            <input type="number" id="name-count" min="1" max="50" value="10" />

            <button id="name-generate-button" type="button" class="btn-primary">
              Generate
            </button>
          </div>

          <ul
            id="name-results"
            class="history-list"
            data-empty="Generate some names to see them here."
          ></ul>
        </section>
      </main>
    </div>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
